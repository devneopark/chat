name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "backend/**"
      - ".github/workflows/*.yml"
  push:
    branches:
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/*.yml"

permissions:
  contents: read

jobs:
  build:
    name: Detect affected modules and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}

      - name: Fetch release refs
        run: git fetch origin develop main --tags

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Print module graph
        run: |
          mkdir -p build
          ./gradlew -q printModuleGraph > build/module-graph.json

      - name: Detect affected modules
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="origin/${BASE_REF}"
          else
            BASE="$BEFORE_SHA"
          fi
          python3 tools/release/module_release.py detect-affected \
            --graph build/module-graph.json \
            --base "$BASE" \
            --head HEAD \
            --output build/affected.json

      - name: Bump affected modules to SNAPSHOT
        if: >-
          ${{
            github.event_name == 'pull_request' &&
            github.base_ref == 'develop' &&
            github.event.pull_request.head.repo.full_name == github.repository
          }}
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          python3 tools/release/module_release.py bump-snapshots \
            --affected build/affected.json \
            --labels-json "$LABELS_JSON"

      - name: Push SNAPSHOT version bump
        if: >-
          ${{
            github.event_name == 'pull_request' &&
            github.base_ref == 'develop' &&
            github.event.pull_request.head.repo.full_name == github.repository
          }}
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- gradle/libs.versions.toml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/libs.versions.toml
          git commit -m "chore: affected 모듈 SNAPSHOT 버전 갱신"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${HEAD_REF}"

      - name: Build affected modules
        env:
          AFFECTED_PATHS: ${{ steps.affected.outputs.affected_paths }}
        run: |
          set -euo pipefail
          if [ -z "$AFFECTED_PATHS" ]; then
            ./gradlew build
            exit 0
          fi
          for module_path in $AFFECTED_PATHS; do
            ./gradlew "${module_path}:build"
          done
