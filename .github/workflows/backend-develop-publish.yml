name: "백엔드 develop SNAPSHOT 배포"

on:
  push:
    branches:
      - 'develop/backend/**'
    paths:
      - 'backend/**'

permissions:
  contents: write
  packages: write

concurrency:
  group: backend-publish
  cancel-in-progress: false

jobs:
  publish_snapshot:
    name: "백엔드 SNAPSHOT 배포"
    runs-on: ubuntu-latest
    env:
      GH_PACKAGES_USERNAME: ${{ github.actor }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: ${{ github.event.before }}
      HEAD_SHA: ${{ github.sha }}
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      RELEASE_CHANNEL: snapshot
      AFFECTED_MODULES_FILE: backend/build/affected-modules.tsv

    steps:
      - name: "저장소 가져오기"
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: "자바 설정"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: "Gradle 설정"
        uses: gradle/actions/setup-gradle@v5

      - name: "Kotlin 컴파일러 설정"
        env:
          KOTLIN_VERSION: "2.3.21"
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" \
            --output "$RUNNER_TEMP/kotlin.zip"
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"

      - name: "영향 모듈 계산"
        run: >-
          kotlinc -script
          .github/workflows/scripts/backend/calculate-affected-modules.kts
          -- --output backend/build/affected-modules.tsv

      - name: "stable 버전 및 SNAPSHOT 의존성 검증"
        run: >-
          kotlinc -script
          .github/workflows/scripts/backend/validate-stable-versions.kts
          -- --input backend/build/affected-modules.tsv

      - name: "Packages 및 Releases SNAPSHOT 배포"
        run: kotlinc -script .github/workflows/scripts/backend/publish-backend.kts
