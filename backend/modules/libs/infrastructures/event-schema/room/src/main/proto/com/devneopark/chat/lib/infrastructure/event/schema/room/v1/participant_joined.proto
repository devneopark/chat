syntax = "proto3";

package com.devneopark.chat.lib.infrastructure.event.schema.room.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.devneopark.chat.lib.infrastructure.event.schema.room.v1";

// 사용자가 채팅방에 입장했음을 나타내는 이벤트 payload다.
message ParticipantJoined {

  // 입장한 채팅방의 식별자다.
  string room_id = 1;

  // 입장으로 생성된 참여자의 식별자다.
  string participant_id = 2;

  // 입장한 사용자의 식별자다.
  string user_id = 3;

  // 입장 시 부여된 참여자의 역할이다.
  string role = 4;

  // 입장이 완료된 시각이다.
  google.protobuf.Timestamp joined_at = 5;

}
