syntax = "proto3";

package com.devneopark.chat.lib.infrastructure.event.schema.room.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.devneopark.chat.lib.infrastructure.event.schema.room.v1";

// 기존 호스트가 퇴장하고 다른 참여자에게 호스트가 승계되었음을 나타내는 이벤트 payload다.
message HostLeft {

  // 호스트가 퇴장한 채팅방의 식별자다.
  string room_id = 1;

  // 퇴장한 기존 호스트 참여자의 식별자다.
  string previous_host_participant_id = 2;

  // 퇴장한 기존 호스트 사용자의 식별자다.
  string previous_host_user_id = 3;

  // 호스트를 승계한 참여자의 식별자다.
  string new_host_participant_id = 4;

  // 호스트를 승계한 사용자의 식별자다.
  string new_host_user_id = 5;

  // 호스트 승계가 완료된 시각이다.
  google.protobuf.Timestamp transferred_at = 6;

}
