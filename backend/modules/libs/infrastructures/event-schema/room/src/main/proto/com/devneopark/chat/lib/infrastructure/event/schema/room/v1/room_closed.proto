syntax = "proto3";

package com.devneopark.chat.lib.infrastructure.event.schema.room.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.devneopark.chat.lib.infrastructure.event.schema.room.v1";

// 채팅방이 폐쇄되어 더 이상 참여할 수 없게 되었음을 나타내는 이벤트 payload다.
message RoomClosed {

  // 폐쇄된 채팅방의 식별자다.
  string room_id = 1;

  // 폐쇄 시 퇴장한 호스트 참여자의 식별자다.
  string host_participant_id = 2;

  // 폐쇄 시 퇴장한 호스트 사용자의 식별자다.
  string host_user_id = 3;

  // 채팅방 폐쇄가 완료된 시각이다.
  google.protobuf.Timestamp closed_at = 4;

}
