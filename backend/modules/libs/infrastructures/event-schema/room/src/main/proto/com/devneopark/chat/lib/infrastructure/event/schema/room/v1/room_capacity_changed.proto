syntax = "proto3";

package com.devneopark.chat.lib.infrastructure.event.schema.room.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.devneopark.chat.lib.infrastructure.event.schema.room.v1";

// 채팅방의 최대 참여 인원이 변경되었음을 나타내는 이벤트 payload다.
message RoomCapacityChanged {

  // 정원이 변경된 채팅방의 식별자다.
  string room_id = 1;

  // 변경 전 정원이다.
  int32 previous_capacity = 2;

  // 변경 후 정원이다.
  int32 current_capacity = 3;

  // 정원 변경이 완료된 시각이다.
  google.protobuf.Timestamp changed_at = 4;

}
