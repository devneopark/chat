syntax = "proto3";

package com.devneopark.chat.lib.infrastructure.event.schema.room.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.devneopark.chat.lib.infrastructure.event.schema.room.v1";

// 채팅방이 생성되어 참여할 수 있는 상태가 되었음을 나타내는 이벤트 payload다.
message RoomOpened {

  // 생성된 채팅방의 식별자다.
  string room_id = 1;

  // 초기 호스트 참여자의 식별자다.
  string host_participant_id = 2;

  // 초기 호스트 사용자의 식별자다.
  string host_user_id = 3;

  // 채팅방 생성이 완료된 시각이다.
  google.protobuf.Timestamp opened_at = 4;

}
