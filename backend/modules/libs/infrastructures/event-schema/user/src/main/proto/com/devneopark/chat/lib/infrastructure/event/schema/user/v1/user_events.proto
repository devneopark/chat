syntax = "proto3";

package com.devneopark.chat.lib.infrastructure.event.schema.user.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.devneopark.chat.lib.infrastructure.event.schema.user.v1";

// 사용자의 프로필이 변경되었음을 나타내는 이벤트 payload다.
message UserProfileChanged {

  // 프로필이 변경된 사용자의 식별자다.
  string user_id = 1;

  // 변경된 사용자의 표시 이름이다.
  string display_name = 2;

  // 프로필 변경이 발생한 시각이다.
  google.protobuf.Timestamp changed_at = 3;

}
