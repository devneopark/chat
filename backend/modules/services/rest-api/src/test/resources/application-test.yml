spring:
  sql:
    init:
      mode: always
      schema-locations:
        - init/schema.sql
      data-locations:
        - init/data.sql

chat:
  application:
    room:
      policy:
        validation:
          capacity: 20
          info:
            pattern:
              title: ^.{1,50}$
              password: ^[0-9a-zA-Z]{1,32}$
    user:
      policy:
        validation:
          credential:
            pattern:
              principal: ^[a-zA-Z0-9._-]{4,32}$
              password: ^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^a-zA-Z0-9])[a-zA-Z0-9-=₩`~!@#$%^&*()_+\[\]\\{}|;':\",./<>?]{8,32}$
          profile:
            pattern:
              displayName: ^.{1,10}$
  infrastructure:
    auth:
      partition:
        initialize-on-startup: true
      cookie:
        name: SRTID
        httpOnly: true
        secure: true
        sameSite: Lax

logging:
  level:
    com.devneopark.chat: trace
    org.springframework.r2dbc.core: debug
