spring:
  sql:
    init:
      mode: always
      schema-locations:
        - init/schema.sql
      data-locations:
        - init/data.sql

chat:
  infrastructure:
    auth:
      cookie:
        name: SRTID
        httpOnly: true
        secure: true
        sameSite: Lax

logging:
  level:
    com.devneopark.chat: trace
    org.springframework.r2dbc.core: debug
