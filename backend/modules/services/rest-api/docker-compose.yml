services:
  postgres:
    image: postgres:16.13
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: test
    volumes:
      - "./modules/services/rest-api/src/main/resources/init/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
